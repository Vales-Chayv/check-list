name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Put the site inside the app
        run: |
          bash .github/scripts/site-files.sh www

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Number the build (so the app drops old downloaded site copies on update)
        run: |
          sed -i 's/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Raise minSdk to 23 (needed by the updater plugin)
        run: |
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 23/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle

      - name: Upgrade Android build tools to compileSdk 35 (needed by the updater plugin)
        run: |
          sed -i 's#com.android.tools.build:gradle:[0-9.]*#com.android.tools.build:gradle:8.7.3#' android/build.gradle
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
          grep -n "com.android.tools.build" android/build.gradle
          grep -n distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          grep -n "SdkVersion" android/variables.gradle

      - name: Add native video compression
        run: |
          D=android/app/src/main/java/app/mycards/mobile
          mkdir -p $D
          cp android-native/McVideoPlugin.java $D/McVideoPlugin.java
          cp android-native/McRecService.java $D/McRecService.java
          cp android-native/McRecPlugin.java $D/McRecPlugin.java
          cp android-native/McApp.java $D/McApp.java
          cp android-native/McCrashActivity.java $D/McCrashActivity.java
          cp android-native/MainActivity.java $D/MainActivity.java
          G=android/app/build.gradle
          grep -q media3-transformer $G || sed -i 's#^dependencies {#dependencies {\n    implementation "androidx.media3:media3-transformer:1.4.1"\n    implementation "androidx.media3:media3-effect:1.4.1"\n    implementation "androidx.media3:media3-common:1.4.1"#' $G
          grep -n media3 $G

      - name: Add Firebase config
        run: |
          cp google-services.json android/app/google-services.json
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Add alarm permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q SCHEDULE_EXACT_ALARM $M || sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application#' $M
          grep -q RECEIVE_BOOT_COMPLETED $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application#' $M

      - name: Add microphone permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application#' $M
          grep -q MODIFY_AUDIO_SETTINGS $M || sed -i 's#<application#<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
          grep -q 'permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' $M
          grep -q 'hardware.camera"' $M || sed -i 's#<application#<uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M

      - name: Add background voice recording
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.FOREGROUND_SERVICE"' $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <application#' $M
          grep -q FOREGROUND_SERVICE_MICROPHONE $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <application#' $M
          grep -q McRecService $M || sed -i 's#</application>#    <service android:name=".McRecService" android:exported="false" android:foregroundServiceType="microphone" />\n    </application>#' $M
          grep -q McCrashActivity $M || sed -i 's#</application>#    <activity android:name=".McCrashActivity" android:exported="false" android:process=":crash" android:theme="@android:style/Theme.Material.Light" />\n    </application>#' $M
          grep -q 'android:name=".McApp"' $M || sed -i '0,/<application/s#<application#<application android:name=".McApp"#' $M
          grep -n "FOREGROUND_SERVICE\|McRecService" $M

      - name: Add upload service, folder access and screen recording
        run: |
          D=android/app/src/main/java/app/mycards/mobile
          cp android-native/McUpService.java $D/McUpService.java
          cp android-native/McSysPlugin.java $D/McSysPlugin.java
          cp android-native/McScreenService.java $D/McScreenService.java
          cp android-native/McScreenPlugin.java $D/McScreenPlugin.java
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.FOREGROUND_SERVICE"' $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <application#' $M
          grep -q FOREGROUND_SERVICE_DATA_SYNC $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <application#' $M
          grep -q FOREGROUND_SERVICE_MEDIA_PROJECTION $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n    <application#' $M
          grep -q FOREGROUND_SERVICE_MICROPHONE $M || sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <application#' $M
          grep -q 'android:name=".McUpService"' $M || sed -i 's#</application>#    <service android:name=".McUpService" android:exported="false" android:stopWithTask="true" android:foregroundServiceType="dataSync" />\n    </application>#' $M
          grep -q 'android:name=".McScreenService"' $M || sed -i 's#</application>#    <service android:name=".McScreenService" android:exported="false" android:stopWithTask="true" android:foregroundServiceType="mediaProjection|microphone" />\n    </application>#' $M
          grep -n "FOREGROUND_SERVICE\|McUpService\|McScreenService" $M

      - name: Point Gradle at the permanent test key
        run: |
          cat > "$GITHUB_WORKSPACE/sign.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android.signingConfigs.debug {
                  storeFile new File(System.getenv('GITHUB_WORKSPACE'), 'debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
                  storeType 'pkcs12'
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I "$GITHUB_WORKSPACE/sign.gradle" assembleDebug

      - name: Show signing fingerprint
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: mycards-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
