name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Prepare placeholder web folder
        run: |
          mkdir -p www
          echo '<!doctype html><title>Мои карточки</title>' > www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Point Gradle at the permanent test key
        run: |
          cat > "$GITHUB_WORKSPACE/sign.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android.signingConfigs.debug {
                  storeFile new File(System.getenv('GITHUB_WORKSPACE'), 'debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
                  storeType 'pkcs12'
                }
              }
            }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew -I "$GITHUB_WORKSPACE/sign.gradle" assembleDebug

      - name: Show signing fingerprint
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep SHA256 || true

      - uses: actions/upload-artifact@v4
        with:
          name: mycards-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
